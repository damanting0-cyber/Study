<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌸 몰입가든</title>

<!-- PWA 설정 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b8e4e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">

<!-- iOS PWA 지원 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="몰입가든">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 50%, #ffd3b6 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    text-align: center;
  }
  h1 { font-size: 28px; color: #2d5016; margin-bottom: 8px; }
  .subtitle { font-size: 13px; color: #6b8e4e; margin-bottom: 24px; }

  .timer-display {
    font-size: 72px;
    font-weight: 700;
    color: #2d5016;
    font-variant-numeric: tabular-nums;
    margin: 16px 0;
    letter-spacing: 2px;
  }
  .mode-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .mode-focus { background: #ffd3b6; color: #8b4513; }
  .mode-break { background: #a8e6cf; color: #2d5016; }

  .buttons { display: flex; gap: 10px; margin: 20px 0; }
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-start { background: #6b8e4e; color: white; }
  .btn-pause { background: #ffd3b6; color: #8b4513; }
  .btn-reset { background: #eee; color: #555; }

  .garden {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    min-height: 60px;
    margin: 20px 0;
    padding: 12px;
    background: rgba(168,230,207,0.3);
    border-radius: 16px;
  }
  .flower { font-size: 24px; animation: bloom 0.6s ease-out; }
  @keyframes bloom {
    0% { transform: scale(0) rotate(-45deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .stat { font-size: 14px; color: #6b8e4e; margin-top: 8px; }

  .perm-warning {
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    display: none;
    line-height: 1.5;
  }
  .perm-warning button {
    margin-top: 8px;
    padding: 8px 14px;
    background: #856404;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    flex: none;
  }

  .install-banner {
    display: none;
    background: #2d5016;
    color: white;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .install-banner button {
    background: #ffd3b6;
    color: #2d5016;
    margin-top: 8px;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    flex: none;
  }
</style>
</head>
<body>
<div class="app">
  <div class="install-banner" id="installBanner">
    📲 몰입가든을 홈 화면에 설치하고<br>앱처럼 사용해보세요!
    <br><button onclick="installApp()">설치하기</button>
  </div>

  <h1>🌸 몰입가든</h1>
  <p class="subtitle">25분 집중이 꽃을 피웁니다</p>

  <div class="perm-warning" id="permWarning">
    🔔 알림 권한이 꺼져 있어요.
    <br><button onclick="requestNotif()">알림 허용하기</button>
  </div>

  <div class="mode-badge mode-focus" id="modeBadge">🍅 집중 시간</div>
  <div class="timer-display" id="timer">25:00</div>

  <div class="buttons">
    <button class="btn-start" id="startBtn" onclick="start()">집중 시작</button>
    <button class="btn-pause" id="pauseBtn" onclick="pause()" disabled>일시정지</button>
    <button class="btn-reset" onclick="reset()">초기화</button>
  </div>

  <div class="garden" id="garden">
    <span style="color:#aaa; font-size:12px; align-self:center;">아직 핀 꽃이 없어요 🌱</span>
  </div>
  <div class="stat" id="stat">오늘 핀 꽃: 0송이</div>
</div>

<script>
const FOCUS_TIME = 25 * 60;
const BREAK_TIME = 5 * 60;

let timeLeft = FOCUS_TIME;
let isFocus = true;
let isRunning = false;
let endTime = 0;
let timerInterval = null;
let flowerCount = 0;
let deferredPrompt = null;

const timerEl = document.getElementById('timer');
const modeBadge = document.getElementById('modeBadge');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const gardenEl = document.getElementById('garden');
const statEl = document.getElementById('stat');
const permWarning = document.getElementById('permWarning');
const installBanner = document.getElementById('installBanner');

// ===== Service Worker 등록 =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('✅ SW 등록:', reg.scope))
      .catch(err => console.error('❌ SW 실패:', err));
  });
}

// ===== 알림 권한 =====
function checkNotifPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    permWarning.style.display = 'block';
    permWarning.innerHTML = '🔔 알림 권한이 꺼져 있어요.<br><button onclick="requestNotif()">알림 허용하기</button>';
  } else if (Notification.permission === 'denied') {
    permWarning.style.display = 'block';
    permWarning.innerHTML = '🔕 알림이 차단되어 있어요.<br>브라우저 설정에서 알림을 허용해주세요.';
  } else {
    permWarning.style.display = 'none';
  }
}

async function requestNotif() {
  if (!('Notification' in window)) return;
  const permission = await Notification.requestPermission();
  checkNotifPermission();
  if (permission === 'granted') {
    notify('🌸 몰입가든', '알림이 활성화되었어요! 꽃이 필 때 알려드릴게요.');
  }
}

// Service Worker를 통한 알림 (백그라운드에서도 유지됨)
async function notify(title, body) {
  if (Notification.permission !== 'granted') return;

  // SW가 준비되면 SW로 알림
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, {
        body: body,
        icon: 'icon.svg',
        badge: 'icon.svg',
        tag: 'molip-garden',
        vibrate: [200, 100, 200],
        requireInteraction: false,
        data: { url: '/' }
      });
      return;
    } catch (e) {
      console.warn('SW 알림 실패, 기본 알림 사용:', e);
    }
  }

  // 폴백: 기본 알림
  new Notification(title, { body, icon: 'icon.svg' });
}

// ===== 타이머 로직 (절대 시간 기반) =====
function updateDisplay() {
  const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const s = (timeLeft % 60).toString().padStart(2, '0');
  timerEl.textContent = `${m}:${s}`;
  document.title = `${m}:${s} 🌸 몰입가든`;
}

function tick() {
  if (!isRunning) return;
  const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
  timeLeft = remaining;
  updateDisplay();
  if (remaining <= 0) {
    clearInterval(timerInterval);
    isRunning = false;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    sessionComplete();
  }
}

function start() {
  if (isRunning) return;
  if (Notification.permission === 'default') requestNotif();

  isRunning = true;
  endTime = Date.now() + timeLeft * 1000;
  startBtn.disabled = true;
  pauseBtn.disabled = false;

  clearInterval(timerInterval);
  timerInterval = setInterval(tick, 250);
  tick();
}

function pause() {
  clearInterval(timerInterval);
  isRunning = false;
  startBtn.disabled = false;
  pauseBtn.disabled = true;
}

function reset() {
  clearInterval(timerInterval);
  isRunning = false;
  isFocus = true;
  timeLeft = FOCUS_TIME;
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  updateDisplay();
  modeBadge.textContent = '🍅 집중 시간';
  modeBadge.className = 'mode-badge mode-focus';
}

async function sessionComplete() {
  if (isFocus) {
    flowerCount++;
    addFlower();
    await notify(
      '🌷 꽃이 피었어요!',
      `${flowerCount}번째 꽃이 피었습니다. 5분 휴식할 시간이에요.`
    );
    isFocus = false;
    timeLeft = BREAK_TIME;
    modeBadge.textContent = '💧 휴식 시간';
    modeBadge.className = 'mode-badge mode-break';
  } else {
    await notify(
      '🌱 다시 집중할 시간!',
      '휴식이 끝났어요. 새로운 꽃을 피워볼까요?'
    );
    isFocus = true;
    timeLeft = FOCUS_TIME;
    modeBadge.textContent = '🍅 집중 시간';
    modeBadge.className = 'mode-badge mode-focus';
  }
  updateDisplay();
  start();
}

function addFlower() {
  if (flowerCount === 1) gardenEl.innerHTML = '';
  const flowers = ['🌷','🌹','🌻','🌸','🌼','🌺','💐','🏵️'];
  const flower = document.createElement('span');
  flower.className = 'flower';
  flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
  gardenEl.appendChild(flower);
  statEl.textContent = `오늘 핀 꽃: ${flowerCount}송이`;
  localStorage.setItem('flowerCount', flowerCount);
}

// ===== 설치 배너 =====
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.style.display = 'block';
});

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(choice => {
    if (choice.outcome === 'accepted') {
      installBanner.style.display = 'none';
    }
    deferredPrompt = null;
  });
}

// ===== 초기화 =====
checkNotifPermission();
updateDisplay();
</script>
</body>
</html>
