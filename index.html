<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 몰입가든</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 50%, #ffd3b6 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .app {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    text-align: center;
  }
  h1 { font-size: 28px; color: #2d5016; margin-bottom: 8px; }
  .subtitle { font-size: 13px; color: #6b8e4e; margin-bottom: 24px; }

  .timer-display {
    font-size: 72px;
    font-weight: 700;
    color: #2d5016;
    font-variant-numeric: tabular-nums;
    margin: 16px 0;
    letter-spacing: 2px;
  }
  .mode-badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .mode-focus { background: #ffd3b6; color: #8b4513; }
  .mode-break { background: #a8e6cf; color: #2d5016; }

  .buttons { display: flex; gap: 10px; margin: 20px 0; }
  button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-start { background: #6b8e4e; color: white; }
  .btn-pause { background: #ffd3b6; color: #8b4513; }
  .btn-reset { background: #eee; color: #555; }

  .garden {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    min-height: 60px;
    margin: 20px 0;
    padding: 12px;
    background: rgba(168,230,207,0.3);
    border-radius: 16px;
  }
  .flower { font-size: 24px; animation: bloom 0.6s ease-out; }
  @keyframes bloom {
    0% { transform: scale(0) rotate(-45deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .stat { font-size: 14px; color: #6b8e4e; margin-top: 8px; }

  .notify-notice {
    font-size: 11px;
    color: #999;
    margin-top: 12px;
    line-height: 1.4;
  }
  .perm-warning {
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    display: none;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🌸 몰입가든</h1>
  <p class="subtitle">25분 집중이 꽃을 피웁니다</p>

  <div class="perm-warning" id="permWarning">
    🔔 알림 권한이 꺼져 있어요. 아래 버튼을 눌러 허용해주세요.
    <br><button onclick="requestNotif()" style="margin-top:8px; padding:8px; background:#856404; color:white; border:none; border-radius:6px; cursor:pointer; width:auto;">알림 허용하기</button>
  </div>

  <div class="mode-badge mode-focus" id="modeBadge">🍅 집중 시간</div>
  <div class="timer-display" id="timer">25:00</div>

  <div class="buttons">
    <button class="btn-start" id="startBtn" onclick="start()">집중 시작</button>
    <button class="btn-pause" id="pauseBtn" onclick="pause()" disabled>일시정지</button>
    <button class="btn-reset" onclick="reset()">초기화</button>
  </div>

  <div class="garden" id="garden">
    <span style="color:#aaa; font-size:12px; align-self:center;">아직 핀 꽃이 없어요 🌱</span>
  </div>
  <div class="stat" id="stat">오늘 핀 꽃: 0송이</div>

  <p class="notify-notice">
    ※ 알림은 HTTPS 또는 localhost 환경에서만 작동합니다.<br>
    파일을 직접 열었다면 로컬 서버로 실행해주세요.
  </p>
</div>

<script>
let FOCUS_TIME = 25 * 60;
let BREAK_TIME = 5 * 60;
let timeLeft = FOCUS_TIME;
let isFocus = true;
let isRunning = false;
let timerInterval = null;
let flowerCount = 0;

const timerEl = document.getElementById('timer');
const modeBadge = document.getElementById('modeBadge');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const gardenEl = document.getElementById('garden');
const statEl = document.getElementById('stat');
const permWarning = document.getElementById('permWarning');

// ===== 알림 권한 처리 =====
function checkNotifPermission() {
  if (!('Notification' in window)) {
    permWarning.style.display = 'block';
    permWarning.textContent = '이 브라우저는 알림을 지원하지 않아요.';
    return;
  }
  if (Notification.permission === 'default') {
    permWarning.style.display = 'block';
  } else if (Notification.permission === 'denied') {
    permWarning.style.display = 'block';
    permWarning.innerHTML = '🔕 알림이 차단되어 있어요. 브라우저 주소창 옆 자물쇠 아이콘에서 허용해주세요.';
  } else {
    permWarning.style.display = 'none';
  }
}

async function requestNotif() {
  if (!('Notification' in window)) return;
  const permission = await Notification.requestPermission();
  checkNotifPermission();
  if (permission === 'granted') {
    sendNotification('🌸 몰입가든', '알림이 활성화되었어요! 이제 꽃이 필 때 알려드릴게요.');
  }
}

function sendNotification(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;

  const notif = new Notification(title, {
    body: body,
    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌸</text></svg>',
    badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌸</text></svg>',
    tag: 'immersion-garden',
    requireInteraction: false,
  });

  notif.onclick = () => {
    window.focus();
    notif.close();
  };

  // 5초 후 자동 닫기
  setTimeout(() => notif.close(), 5000);
}

// ===== 타이머 로직 =====
function updateDisplay() {
  const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
  const s = (timeLeft % 60).toString().padStart(2, '0');
  timerEl.textContent = `${m}:${s}`;
  document.title = `${m}:${s} 🌸 몰입가든`;
}

function start() {
  if (isRunning) return;
  // 시작할 때 알림 권한이 없으면 요청
  if (Notification.permission === 'default') requestNotif();

  isRunning = true;
  startBtn.disabled = true;
  pauseBtn.disabled = false;

  timerInterval = setInterval(() => {
    timeLeft--;
    updateDisplay();

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      isRunning = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      sessionComplete();
    }
  }, 1000);
}

function pause() {
  clearInterval(timerInterval);
  isRunning = false;
  startBtn.disabled = false;
  pauseBtn.disabled = true;
}

function reset() {
  clearInterval(timerInterval);
  isRunning = false;
  isFocus = true;
  timeLeft = FOCUS_TIME;
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  updateDisplay();
  modeBadge.textContent = '🍅 집중 시간';
  modeBadge.className = 'mode-badge mode-focus';
}

function sessionComplete() {
  if (isFocus) {
    // 집중 완료 → 꽃 피우기
    flowerCount++;
    addFlower();
    sendNotification(
      '🌷 꽃이 피었어요!',
      `축하해요! ${flowerCount}번째 꽃이 피었습니다. 이제 5분 휴식할 시간이에요.`
    );
    // 휴식으로 전환
    isFocus = false;
    timeLeft = BREAK_TIME;
    modeBadge.textContent = '💧 휴식 시간';
    modeBadge.className = 'mode-badge mode-break';
  } else {
    // 휴식 완료 → 집중으로
    sendNotification(
      '🌱 다시 집중할 시간!',
      '휴식이 끝났어요. 새로운 꽃을 피워볼까요?'
    );
    isFocus = true;
    timeLeft = FOCUS_TIME;
    modeBadge.textContent = '🍅 집중 시간';
    modeBadge.className = 'mode-badge mode-focus';
  }
  updateDisplay();
  start();
}

function addFlower() {
  if (flowerCount === 1) gardenEl.innerHTML = '';
  const flowers = ['🌷','🌹','🌻','🌸','🌼','🌺','💐','🏵️'];
  const flower = document.createElement('span');
  flower.className = 'flower';
  flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
  gardenEl.appendChild(flower);
  statEl.textContent = `오늘 핀 꽃: ${flowerCount}송이`;
}

// 초기화
checkNotifPermission();
updateDisplay();
</script>
</body>
</html>
